name: Deploy Docs + Web Editor to GitHub Pages

# Single combined Pages deploy for the whole repo. GitHub Pages serves one
# artifact per repo, so the two pieces — which live on different branches —
# must be built and uploaded together here:
#
#   - Jekyll docs site  (from this `master` branch's docs/)     -> site root
#   - SvelteKit editor  (from the `1.21.1` branch's website/)   -> /editor/
#
# The editor source exists only on 1.21.1, so we check that branch out into
# editor-src/ and build it cross-branch. Result is published at:
#   docs   -> https://cyberday1.github.io/NeoOrigins/
#   editor -> https://cyberday1.github.io/NeoOrigins/editor/
#
# Triggers:
#   - push to master touching docs/ or this workflow (docs changes)
#   - repository_dispatch [editor-updated], fired by 1.21.1's editor-pages.yml
#     when the editor changes (requires the PAGES_DISPATCH_TOKEN PAT secret;
#     see that workflow). Without the secret, redeploy editor changes by
#     running this workflow manually.
#   - workflow_dispatch (manual redeploy of the latest of both)
#
# One-time repo setup: Settings -> Pages -> Source must be "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  repository_dispatch:
    types: [editor-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; don't cancel in-progress so a queued run still
# lands cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs (master)
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build docs with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Checkout editor source (1.21.1)
        uses: actions/checkout@v4
        with:
          ref: 1.21.1
          path: editor-src

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-website-${{ hashFiles('editor-src/website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-website-

      - name: Install editor dependencies
        working-directory: editor-src/website
        run: npm ci

      # Editor reads its schemas from static/schemas/ at runtime; sync from the
      # 1.21.1 source-of-truth docs/schema/ so the deployed editor matches.
      - name: Sync schemas (1.21.1 docs/schema -> editor static/schemas)
        run: |
          mkdir -p editor-src/website/static/schemas
          cp editor-src/docs/schema/*.json editor-src/website/static/schemas/
          ls -la editor-src/website/static/schemas/

      - name: Build SvelteKit editor
        working-directory: editor-src/website
        env:
          # Force the production base path (/NeoOrigins/editor) regardless of
          # how the runner seeds NODE_ENV.
          NODE_ENV: production
        run: npm run build

      # Editor is built with base path /NeoOrigins/editor, so it must live at
      # the /editor/ subdirectory of the site.
      - name: Place editor under /editor/
        run: |
          mkdir -p _site/editor
          cp -r editor-src/website/build/. _site/editor/
          echo "editor files:"; ls -la _site/editor/ | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
