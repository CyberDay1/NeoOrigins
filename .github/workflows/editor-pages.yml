name: Deploy Web Editor to GitHub Pages

# Builds the SvelteKit web editor at `website/` and deploys it to
# GitHub Pages under cyberday1.github.io/NeoOrigins/editor/.
#
# Schema sync: on every run, `docs/schema/*.json` is copied into
# `website/static/schemas/` so the editor's runtime fetch hits the
# current source-of-truth schemas. Drift between the committed
# `static/schemas/` copy and `docs/schema/` is surfaced as a warning.
#
# Pages-deploy collision note:
#   The `master` branch's `.github/workflows/pages.yml` currently
#   publishes the mkdocs docs site to the same Pages environment.
#   The build job here always runs (so the editor stays buildable on
#   1.21.1 pushes), but the deploy job is gated `if: false` until the
#   mkdocs deploy pipeline is consolidated with this one — otherwise
#   running both would have the editor clobber the docs site (or vice
#   versa) on every push. See planning/web_editor_scope.md, "Docs site
#   host-branch decision" for the follow-up plan.

on:
  push:
    branches: [1.21.1]
    paths:
      - 'website/**'
      - 'docs/schema/**'
      - '.github/workflows/editor-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel queued runs so the latest
# push wins (editor is single-source-of-truth, no value in replaying
# older builds).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-website-${{ hashFiles('website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-website-

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Sync schemas from docs/schema/ → website/static/schemas/
        run: |
          mkdir -p website/static/schemas
          cp docs/schema/*.json website/static/schemas/
          ls -la website/static/schemas/

      # Drift check: if the committed `website/static/schemas/` ever
      # diverges from `docs/schema/`, fail the build so the dev knows
      # to recommit. On the very first run (before the editor agent
      # has committed `website/static/schemas/`), skip with a warning.
      - name: Detect schema drift
        run: |
          if git ls-files --error-unmatch website/static/schemas/ > /dev/null 2>&1; then
            git diff --exit-code -- website/static/schemas/
          else
            echo "::warning::website/static/schemas/ not yet committed; skipping drift check"
          fi

      - name: Build SvelteKit static site
        working-directory: website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    # Gated off until the master-branch mkdocs pages workflow is
    # consolidated with this one (see planning/web_editor_scope.md).
    # Flip to `if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/1.21.1'`
    # once the docs deploy moves to a release branch or is folded into
    # this workflow.
    if: false
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
