name: Build Web Editor (and trigger Pages deploy)

# The web editor lives only on this branch (1.21.1), but the repo's GitHub
# Pages site is built and deployed by a single combined workflow on `master`
# (.github/workflows/pages.yml on master), which serves the Jekyll docs at the
# site root and this editor under /editor/. GitHub Pages allows one artifact
# per repo, so the editor cannot deploy independently from here.
#
# This workflow therefore:
#   1. Builds the editor on every 1.21.1 push that touches it — a fast CI
#      sanity check that the editor still compiles (no deploy).
#   2. Notifies master's combined workflow (via repository_dispatch) so the
#      published site at cyberday1.github.io/NeoOrigins/editor/ is rebuilt with
#      the new editor.
#
# Step 2 needs a PAT, because a workflow's default GITHUB_TOKEN cannot trigger
# another workflow run. Create a fine-grained PAT with "Contents: read" on this
# repo and add it as the repo secret PAGES_DISPATCH_TOKEN. Without that secret
# the notify step no-ops with a warning; publish editor changes by running the
# "Deploy Docs + Web Editor to GitHub Pages" workflow on master manually.

on:
  push:
    branches: [1.21.1]
    paths:
      - 'website/**'
      - 'docs/schema/**'
      - '.github/workflows/editor-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-website-${{ hashFiles('website/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-website-

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Sync schemas from docs/schema/ -> website/static/schemas/
        run: |
          mkdir -p website/static/schemas
          cp docs/schema/*.json website/static/schemas/
          ls -la website/static/schemas/

      # Drift check: committed website/static/schemas/ must match docs/schema/.
      - name: Detect schema drift
        run: |
          if git ls-files --error-unmatch website/static/schemas/ > /dev/null 2>&1; then
            git diff --exit-code -- website/static/schemas/
          else
            echo "::warning::website/static/schemas/ not yet committed; skipping drift check"
          fi

      - name: Build SvelteKit static site (CI check)
        working-directory: website
        env:
          NODE_ENV: production
        run: npm run build

  notify-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Trigger combined Pages deploy on master
        env:
          DISPATCH_TOKEN: ${{ secrets.PAGES_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::PAGES_DISPATCH_TOKEN not set; skipping auto-deploy. Run the 'Deploy Docs + Web Editor to GitHub Pages' workflow on master to publish editor changes."
            exit 0
          fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d '{"event_type":"editor-updated"}'
