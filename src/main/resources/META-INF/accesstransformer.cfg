# NeoOrigins access transformers.
#
# Keep this file tiny and justified: every entry is a piece of vanilla we could
# not reach through a public API, with the reason it was needed.

# entity_model morph: MorphRenderHandler draws the player's held item floating in
# front of the morph, because targets like slime have no hand bone. Humanoid and
# villager renderers already draw held items through their own layers, so the
# fallback has to be skipped for those or the item is drawn twice. There is no
# public way to ask a renderer which layers it has.
public net.minecraft.client.renderer.entity.LivingEntityRenderer layers
