modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "neoorigins.png"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jei"
    type = "optional"
    versionRange = "[19,)"
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "roughlyenoughitems"
    type = "optional"
    versionRange = "[16,)"
    ordering = "AFTER"
    side = "CLIENT"

# Jade soft-compat: shows the looked-at mob's origin in the Jade tooltip
# overlay. Client-only, reflective via the @WailaPlugin entrypoint — the mod
# runs unchanged when Jade is absent. (EMI + The One Probe are skipped on 26.1
# until they ship 26.1 NeoForge builds.)
[[dependencies.${mod_id}]]
    modId = "jade"
    type = "optional"
    versionRange = "[26,)"
    ordering = "AFTER"
    side = "CLIENT"

# FTB Quests soft-compat (v2.1.6 backlog #3): the loot_pool_grant power
# accepts FTBQ quest tags of the form `neoorigins_loot_pool_grant:<table_id>`
# and rolls that loot table for the completing player. Entirely reflective —
# the mod runs unchanged when FTBQ is absent.
[[dependencies.${mod_id}]]
    modId = "ftbquests"
    type = "optional"
    versionRange = "[2000,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "neoorigins.mixins.json"

[[mixins]]
    config = "neoorigins-compat.mixins.json"
