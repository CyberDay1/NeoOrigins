modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    logoFile = "neoorigins.png"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jei"
    type = "optional"
    versionRange = "[19,)"
    ordering = "AFTER"
    side = "CLIENT"

[[dependencies.${mod_id}]]
    modId = "roughlyenoughitems"
    type = "optional"
    versionRange = "[16,)"
    ordering = "AFTER"
    side = "CLIENT"

# Jade soft-compat: shows the looked-at mob's origin in the Jade tooltip
# overlay. Client-only, reflective via the @WailaPlugin entrypoint — the mod
# runs unchanged when Jade is absent.
#
# No EMI or The One Probe equivalent is declared, and the reason is not "not yet"
# in any near sense. Checked 2026-07-29: EMI's newest NeoForge release is
# 1.1.24+1.21.1 and The One Probe's is 1.21_neo-12.0.8, so neither has shipped a
# build for ANY 26.x Minecraft, let alone 26.2. Re-check the upstream release
# lists before assuming that changed.
[[dependencies.${mod_id}]]
    modId = "jade"
    type = "optional"
    versionRange = "[26,)"
    ordering = "AFTER"
    side = "CLIENT"

# FTB Quests soft-compat (v2.1.6 backlog #3): the loot_pool_grant power
# accepts FTBQ quest tags of the form `neoorigins_loot_pool_grant:<table_id>`
# and rolls that loot table for the completing player. Entirely reflective —
# the mod runs unchanged when FTBQ is absent.
[[dependencies.${mod_id}]]
    modId = "ftbquests"
    type = "optional"
    versionRange = "[0,)"
    ordering = "AFTER"
    side = "BOTH"

# Dragon Survival soft-compat: the built-in Cave/Forest/Sea Dragon origins are
# gated behind `required_mods: ["dragonsurvival"]` and drive DS's own dragon
# state via the neoorigins:become_dragon power (reflective bridge, no build dep).
# Optional + ordered AFTER so DS registries exist before our origins resolve.
[[dependencies.${mod_id}]]
    modId = "dragonsurvival"
    type = "optional"
    versionRange = "[2.0,)"
    ordering = "AFTER"
    side = "BOTH"

# Iron's Spells 'n Spellbooks soft-compat: the neoorigins:cast_iron_spell action
# casts an Iron's spell as the player (bridged reflectively via a compile-only API
# stub, no build/runtime dep). Optional + ordered AFTER so Iron's spell registry
# exists before our powers resolve.
[[dependencies.${mod_id}]]
    modId = "irons_spellbooks"
    type = "optional"
    versionRange = "[1.21.1-3,)"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "neoorigins.mixins.json"

[[mixins]]
    config = "neoorigins-compat.mixins.json"
