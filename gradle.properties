org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

mod_id=neoorigins
mod_name=NeoOrigins
mod_license=MIT
mod_version=2.2.19
mod_group_id=com.cyberday1.neoorigins
mod_authors=CyberDay1
mod_description=A reimagined Origins experience for NeoForge.

deps.neoforge=21.1.224
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
# Floor matches our build dep; keeps users with an old NeoForge build from
# loading and hitting API-rename crashes (cf. issue #33-style reports).
neo_version_range=[21.1.224,)
loader_version_range=[4,)

# Optional compat dependencies
deps.jei=19.27.0.340
deps.rei=16.0.799
deps.architectury=13.0.8
# KubeJS 1.21.1 NeoForge — soft-dep, mod runs cleanly without it.
# Bump in lockstep with whichever KubeJS build pack authors ship against.
deps.kubejs=2101.7.2-build.368
# EMI — recipe viewer (item info panel for the Orb of Origin).
deps.emi=1.1.22+1.21.1
# Jade — entity tooltip overlay (shows the looked-at mob's origin).
# CurseForge file id for Jade 15.10.5, MC 1.21.1 NeoForge (project 324717).
deps.jade=7545219
# The One Probe — probe overlay (shows the looked-at mob's origin).
# CurseForge file id for TOP 12.x, MC 1.21.1 NeoForge (project 245211).
deps.top=7037783
# FTB Quests 1.21.1 line — soft-dep, mod runs cleanly without it. Provides the
# "grant loot pool" reward type. ftb-library + ftb-teams are FTBQ's own compile
# deps (versions taken from FTBQ 2101.1.25's POM); architectury is already above.
deps.ftbquests=2101.1.25
deps.ftblibrary=2101.1.31
deps.ftbteams=2101.1.9
# Accessories (Wisp Forest) 1.21.1 NeoForge — soft-dep, equipped accessory
# inspection for the equipped_item condition + umbrella detection. Modrinth
# maven coordinate is maven.modrinth:accessories:<version_number>. No 26.1
# build exists, so this integration is 1.21.1-only.
deps.accessories=1.1.0-beta.53+1.21.1
# FTB Ultimine 1.21.1 line — soft-dep, mod runs cleanly without it. Provides the
# `ultimine` power: a registered RestrictionHandler that grants vein-mining to
# active origin holders. Its API references FTB Library types, so deps.ftblibrary
# above covers the compile classpath. 1.21.1-only (no 26.1 build is wired here).
deps.ftbultimine=2101.1.14
# Build A Spell (buildaspell) — soft-dep, the `cast_spell` action casts an
# inline author-baked spell via BuildASpellAPI. Published to mavenLocal; all three
# BaS branches share mod_version 2.0.0, so the published coordinate is suffixed
# -mc<minecraft_version> to keep each branch distinct (this is the MC 1.21.1 jar).
# Swap the suffix to -mc26.1.1 / -mc26.2 when porting to those branches.
deps.buildaspell=2.0.0-mc1.21.1
# Iron's Spells 'n Spellbooks (irons_spellbooks) — soft-dep, the `cast_iron_spell`
# action casts an Iron's spell as the player via its api.spells / api.registry /
# api.magic API. ARR jar, never bundled: the compat bridge compiles against a
# hand-written API stub (src/apistubs/java/io/redspace/ironsspellbooks) and is gated
# behind ModList.isLoaded("irons_spellbooks") at runtime. This prop records the jar
# version the stub descriptors were verified (javap) against.
deps.irons_spellbooks=1.21.1-3.14.0
