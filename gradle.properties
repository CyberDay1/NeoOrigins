org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

mod_id=neoorigins
mod_name=NeoOrigins
mod_license=MIT
mod_version=2.2.24
mod_group_id=com.cyberday1.neoorigins
mod_authors=CyberDay1
mod_description=A reimagined Origins experience for NeoForge.

deps.neoforge=26.2.0.3-beta
minecraft_version=26.2
minecraft_version_range=[26.2,26.3)
# Floor matches our build dep; keeps users on stale NeoForge betas from
# loading and hitting API-rename crashes (cf. issue #33 reporter on .25).
neo_version_range=[26.2.0.3-beta,)
loader_version_range=[4,)

# Optional compat dependencies
# JEI — resolved as mezz.jei:jei-${minecraft_version}-neoforge-api, i.e. the
# MC-26.2 line (30.x). The 29.5.x series is MC 26.1.2 only and does NOT publish
# a jei-26.2-* artifact, so this version must move with minecraft_version.
#
# PINNED, not stale: 30.11.0.66 is the LAST 26.2 build whose mods.toml accepts
# neoforge [26.2.0.3-beta,). From 30.11.0.67 onward JEI requires
# [26.2.0.16-beta,), which our deps.neoforge (26.2.0.3-beta) does not satisfy —
# because JEI is also a runtimeOnly dep, a newer pick fails FML mod loading in
# the unitTest harness outright ("Mod jei requires neoforge 26.2.0.16-beta or
# above"). Bump deps.jei past .66 only together with deps.neoforge.
deps.jei=30.11.0.66
# Jade — entity tooltip overlay (shows the looked-at mob's origin).
# Modrinth version slug for Jade 26.2.x, MC 26.2 NeoForge.
deps.jade=26.2.8+neoforge
# REI (Roughly Enough Items) — client-only item-list soft dep. This is the 26.2
# line's head; RoughlyEnoughItems-neoforge 26.2.821 declares minecraft [26.2,).
# Bump in lockstep with MC. NOTE: the 26.2 line needs architectury-neoforge 21.0.x
# (the 26.1 line wants 20.0.x), and REI's pom pulls it transitively.
deps.rei=26.2.821
# FTB Ultimine — soft-dep, mod runs cleanly without it. Would provide the
# `ultimine` power: a registered RestrictionHandler that grants vein-mining to
# active origin holders. On 26.1 the registration event extends FTB Library's
# BaseEventWithData, so ftb-library is required on the compile classpath.
#
# UNUSED ON THIS BRANCH and the versions below are 26.1's, not 26.2's. Checked
# maven.ftb.dev/releases on 2026-07-29: ftb-ultimine-neoforge tops out at 26.1.2.5
# and ftb-library-neoforge at 26.1.2.6 — no 26.2 line exists to bump to. Kept only
# as the coordinates to move when FTB ships 26.2; see the matching note in
# build.gradle's dependencies block.
deps.ftbultimine=26.1.2.4
deps.ftblibrary=26.1.2.5
# Build A Spell (buildaspell) — soft-dep, the `cast_spell` action casts an
# inline author-baked spell via BuildASpellAPI. Published to mavenLocal; all three
# BaS branches share mod_version 2.0.0, so the published coordinate is suffixed
# -mc<minecraft_version> to keep each branch distinct (this is the MC 26.1.1 jar).
deps.buildaspell=2.0.0-mc26.2
# Iron's Spells 'n Spellbooks (irons_spellbooks) — soft-dep, the `cast_iron_spell`
# action casts an Iron's spell as the player via its api.spells / api.registry /
# api.magic API. ARR jar, never bundled: the compat bridge compiles against a
# hand-written API stub (src/apistubs/java/io/redspace/ironsspellbooks) and is gated
# behind ModList.isLoaded("irons_spellbooks") at runtime. This prop records the jar
# version the stub descriptors were verified (javap) against — the descriptors were
# verified against the 1.21.1-3.14.0 jar; the 26.2 Iron's build is not yet published
# / verified, so confirm signatures before relying on this at runtime.
deps.irons_spellbooks=1.21.1-3.14.0
