org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.debug=false

mod_id=neoorigins
mod_name=NeoOrigins
mod_license=MIT
mod_version=2.2.30
mod_group_id=com.cyberday1.neoorigins
mod_authors=CyberDay1
mod_description=A reimagined Origins experience for NeoForge.

deps.neoforge=26.3.0.95
minecraft_version=26.3
minecraft_version_range=[26.3,26.4)
# Floor: 26.3.0.83 is the oldest build the gate can run on (941 tests plus a
# headless boot, 2026-10-23): below it the dev-only The One Probe artifact refuses
# to load, though the mod's own code still compiles against 26.3.0.76.
neo_version_range=[26.3.0.83,)
loader_version_range=[4,)

# Optional compat dependencies
# JEI — resolved as mezz.jei:jei-${minecraft_version}-neoforge-api, i.e. the
# MC-26.3 line (31.x). Each MC line publishes its own jei-<mc>-* artifacts, so
# this version must move with minecraft_version. 31.16.0.89 requires neoforge
# [26.3.0.1-beta,) and minecraft [26.3]; this only gates the dev/unitTest
# runtime, not players.
deps.jei=31.16.0.89
# Jade — entity tooltip overlay (shows the looked-at mob's origin).
# Modrinth version slug for Jade 26.3.x, MC 26.3 NeoForge.
deps.jade=26.3.5+neoforge
# The One Probe — McJty's maven, -api classifier. First 26.3 build, found 2026-10-23.
deps.top=26.3_neo-16.0.0-1
# REI (Roughly Enough Items) — client-only item-list soft dep. This is the 26.3
# line's head; RoughlyEnoughItems-neoforge 26.3.823's pom pulls cloth-config-neoforge
# 26.3.159 and architectury-neoforge 22.0.3 transitively. Bump in lockstep with MC.
deps.rei=26.3.823
# FTB Ultimine — soft-dep, mod runs cleanly without it. Would provide the
# `ultimine` power: a registered RestrictionHandler that grants vein-mining to
# active origin holders. On 26.1 the registration event extends FTB Library's
# BaseEventWithData, so ftb-library is required on the compile classpath.
#
# UNUSED ON THIS BRANCH and the versions below are 26.1's, not 26.3's. Re-checked
# maven.ftb.dev/releases on 2026-10-23: ftb-ultimine-neoforge tops out at 26.1.2.6
# and ftb-library-neoforge at 26.1.2.10 — no 26.2 or 26.3 line exists to bump to.
# Kept only as the coordinates to move when FTB ships 26.3; see the matching note
# in build.gradle's dependencies block.
deps.ftbultimine=26.1.2.4
deps.ftblibrary=26.1.2.5
# Build A Spell (buildaspell) — soft-dep, the `cast_spell` action casts an
# inline author-baked spell via BuildASpellAPI. Published to mavenLocal; all three
# BaS branches share mod_version 2.0.0, so the published coordinate is suffixed
# -mc<minecraft_version> to keep each branch distinct. No BaS build for 26.3 is
# published yet, so this still names the MC 26.2 jar; the bridge compiles against
# the API stub (see build.gradle), so nothing resolves this coordinate.
deps.buildaspell=2.0.0-mc26.2
# Iron's Spells 'n Spellbooks (irons_spellbooks) — soft-dep, the `cast_iron_spell`
# action casts an Iron's spell as the player via its api.spells / api.registry /
# api.magic API. ARR jar, never bundled: the compat bridge compiles against a
# hand-written API stub (src/apistubs/java/io/redspace/ironsspellbooks) and is gated
# behind ModList.isLoaded("irons_spellbooks") at runtime. This prop records the jar
# version the stub descriptors were verified (javap) against — the descriptors were
# verified against the 1.21.1-3.14.0 jar; no 26.3 Iron's build is published yet
# (Modrinth, 2026-10-23), so confirm signatures before relying on this at runtime.
deps.irons_spellbooks=1.21.1-3.14.0
