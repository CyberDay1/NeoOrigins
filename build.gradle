plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${mod_version}+26.1"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = property('deps.neoforge')

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    // FML-bootstrapped JUnit harness — lets headless tests exercise real game
    // code without launching the client/server. Same MDG unitTest wiring as
    // the 1.21.1 branch (MinionOwnerCodecTest).
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.blamejared.com' }      // JEI
    maven { url = 'https://maven.shedaniel.me' }         // REI
    maven { url = 'https://maven.architectury.dev' }     // Architectury (REI dep)
    // Single-purpose mirror repos are content-scoped to the exact group they
    // host, so a 5xx from one flaky mirror (fatal in Gradle, no fall-through)
    // can't take down deps that live elsewhere.
    maven {
        url = 'https://api.modrinth.com/maven'           // Jade
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.ftb.dev/releases'           // FTB Ultimine / FTB Library
        content { includeGroup 'dev.ftb.mods' }
    }
}

dependencies {
    // JUnit 5 — FML-bootstrapped headless tests (neoForge.unitTest harness).
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.20.0'

    // JEI – compile-only so the mod works without JEI installed
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${property('deps.jei')}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${property('deps.jei')}"

    // REI – client-only soft dep; compat/rei adds the Orb of Origin to REI's entry
    // list. Compile-only, never bundled. The api artifact transitively brings
    // cloth-config-neoforge 26.1.154 and architectury-neoforge 20.0.6 (per REI's own
    // pom), so no explicit architectury coordinate is needed here.
    // Expect ~11 "unknown enum constant EnvType.CLIENT" javac warnings from this:
    // REI's API carries Fabric @Environment annotations and net.fabricmc.api.EnvType
    // isn't on a NeoForge classpath. Harmless (annotation values only) — do NOT
    // "fix" it by dragging fabric-loader into a NeoForge build.
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${property('deps.rei')}"

    // Jade – entity tooltip overlay. Compile-only soft dep (Modrinth maven).
    // EMI and The One Probe have no integration here, and it is not a near-term
    // "not yet": checked 2026-07-29, EMI's newest NeoForge release is
    // 1.1.24+1.21.1 and The One Probe's is 1.21_neo-12.0.8 — neither ships a build
    // for any 26.x Minecraft. Re-read the upstream release lists before assuming.
    compileOnly "maven.modrinth:jade:${property('deps.jade')}"

    // FTB Ultimine – the `ultimine` vein-mining power grants ultimine to active
    // origin holders via a registered RestrictionHandler. Compile-only soft dep;
    // all FTB-Ultimine-typed code is isolated in compat/ftbultimine and only
    // classloaded behind a ModList.isLoaded("ftbultimine") gate. On 26.1 the
    // restriction-handler event (FTBUltimineEvent.RegisterRestrictionHandler)
    // extends FTB Library's BaseEventWithData, so ftb-library must be on the
    // compile classpath too.
    compileOnly "dev.ftb.mods:ftb-ultimine-neoforge:${property('deps.ftbultimine')}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${property('deps.ftblibrary')}"

    // Build A Spell (buildaspell) – the `cast_spell` action casts an inline
    // author-baked spell via BuildASpellAPI. Every BaS-typed reference is
    // isolated in compat/buildaspell/BuildASpellBridge and only classloaded
    // behind a ModList.isLoaded("buildaspell") gate. BaS is published ONLY to
    // the author's local maven, so to keep CI (and any fresh checkout) building
    // without it we compile the bridge against a tiny hand-written API stub
    // (src/apistubs/java/buildaspell) instead of the real jar. The stub carries
    // the exact descriptors of the members the bridge uses, is added to main's
    // COMPILE classpath only (see the apiStubs wiring below), and is never on
    // the runtime classpath nor bundled — so at runtime the real BaS classes
    // load when the mod is present, exactly as a compileOnly soft dep would.
    // If the bridge starts using more of the BaS API, mirror those signatures
    // into the stub (verify descriptors with `javap` against the real jar).
}

sourceSets {
    // Build A Spell compile-only API stub (see the buildaspell note above).
    apiStubs {
        java { srcDir 'src/apistubs/java' }
    }
}

// The stub references net.minecraft.server.level.ServerPlayer, so it needs the
// Minecraft + NeoForge classpath to compile.
neoForge.addModdingDependenciesTo sourceSets.apiStubs

// Expose the stub classes to main at COMPILE time only. Not added to
// runtimeClasspath and not part of the mod jar (the jar is built from the main
// source set), so the stub leaves zero runtime footprint.
sourceSets.main.compileClasspath += sourceSets.apiStubs.output

// Keep the dev-only tooling (CompatTestHarness, PowerAliasSmokeTest, schema
// generators, etc. — all main-sourceSet classes with a main()) OUT of the
// published jar. They're only ever invoked via the JavaExec run-tasks below,
// which build their classpath from sourceSets.main.runtimeClasspath (the
// compiled .class output), NOT the jar artifact — so excluding them from the
// jar leaves those tasks fully functional while trimming the release jar.
tasks.named('jar') {
    exclude '**/dev/**'
}

// FML-bootstrapped JUnit harness (MinionOwnerCodecTest).
tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : project.property('minecraft_version'),
            minecraft_version_range: project.property('minecraft_version_range'),
            neo_version            : project.property('deps.neoforge'),
            neo_version_range      : project.property('neo_version_range'),
            loader_version_range   : project.property('loader_version_range'),
            mod_id                 : project.property('mod_id'),
            mod_name               : project.property('mod_name'),
            mod_license            : project.property('mod_license'),
            mod_version            : project.property('mod_version'),
            mod_authors            : project.property('mod_authors'),
            mod_description        : project.property('mod_description')
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// ── 2.0 power-type consolidation: migration scaffold ───────────────────────
//
// Scans built-in power JSONs for legacy types that are slated to be collapsed
// into the 2.0 generics (active_ability / persistent_effect / condition_passive /
// action_on_event). Currently read-only: reports hits only. Field-remap writes
// will be enabled once the remappers in LegacyPowerTypeAliases are confirmed
// lossless for every internal JSON. Task is removed in Phase 7.
//
// Run: ./gradlew migrateLegacyPowers
tasks.register('migrateLegacyPowers') {
    group = 'neoorigins'
    description = '[2.0] Report which built-in power JSONs reference legacy types scheduled for consolidation.'
    doLast {
        def powersRoot = file('src/main/resources/data')
        if (!powersRoot.exists()) {
            logger.lifecycle("[migrate] no data/ folder found — nothing to do")
            return
        }
        def legacy = [
            'neoorigins:active_launch'          : 'neoorigins:active_ability',
            'neoorigins:active_dash'            : 'neoorigins:active_ability',
            'neoorigins:repulse'                : 'neoorigins:active_ability',
            'neoorigins:active_aoe_effect'      : 'neoorigins:active_ability',
            'neoorigins:active_swap'            : 'neoorigins:active_ability',
            'neoorigins:active_fireball'        : 'neoorigins:active_ability',
            'neoorigins:active_bolt'            : 'neoorigins:active_ability',
            'neoorigins:healing_mist'           : 'neoorigins:active_ability',
            'neoorigins:status_effect'          : 'neoorigins:persistent_effect',
            'neoorigins:stacking_status_effects': 'neoorigins:persistent_effect',
            'neoorigins:night_vision'           : 'neoorigins:persistent_effect',
            'neoorigins:glow'                   : 'neoorigins:persistent_effect',
            'neoorigins:water_breathing'        : 'neoorigins:persistent_effect',
            // breath_in_fluid / regen_in_fluid move under condition_passive in Phase 4 —
            // they're tick-driven fluid checks, not MobEffect applications.
            'neoorigins:breath_in_fluid'        : 'neoorigins:condition_passive',
            'neoorigins:regen_in_fluid'         : 'neoorigins:condition_passive',
            // effect_immunity is a MobEffectEvent canceler — lands in Phase 6 under
            // action_on_event with a cancel_event entity_action.
            'neoorigins:effect_immunity'        : 'neoorigins:action_on_event',
            'neoorigins:biome_buff'             : 'neoorigins:condition_passive',
            'neoorigins:damage_in_biome'        : 'neoorigins:condition_passive',
            'neoorigins:damage_in_daylight'     : 'neoorigins:condition_passive',
            'neoorigins:damage_in_water'        : 'neoorigins:condition_passive',
            'neoorigins:burn_at_health_threshold': 'neoorigins:condition_passive',
            'neoorigins:tick_action'            : 'neoorigins:condition_passive',
            // item_magnetism (needs pull_items verb), mobs_ignore_player + no_mob_spawns_nearby
            // (event interceptors, not tick passives) stay on their own classes.
            'neoorigins:action_on_kill'         : 'neoorigins:action_on_event',
            'neoorigins:action_on_hit_taken'    : 'neoorigins:action_on_event',
            'neoorigins:less_item_use_slowdown' : 'neoorigins:attribute_modifier',
        ]
        def counts = [:].withDefault { 0 }
        int scanned = 0
        fileTree(dir: powersRoot, include: '**/powers/**/*.json').each { f ->
            scanned++
            def text = f.text
            legacy.each { oldType, newType ->
                if (text.contains('"' + oldType + '"')) {
                    counts[oldType] = counts[oldType] + 1
                    logger.info("[migrate] ${f.name.replace('.json', '')}  ${oldType} → ${newType}")
                }
            }
        }
        logger.lifecycle("[migrate] scanned ${scanned} power files")
        if (counts.isEmpty()) {
            logger.lifecycle("[migrate] no legacy type references found.")
        } else {
            counts.each { k, v -> logger.lifecycle("[migrate]   ${v}  × ${k} → ${legacy[k]}") }
            logger.lifecycle("[migrate] NOTE: scaffold mode (read-only). Writes enabled once field remappers in LegacyPowerTypeAliases are proven lossless.")
        }
    }
}

// ── 2.0 alias smoke test ────────────────────────────────────────────────────
//
// Runs PowerAliasSmokeTest against src/main/resources/data to validate every
// legacy-typed internal power JSON flows cleanly through LegacyPowerTypeAliases
// and has the right structural fields for its target generic. Catches remap-
// lambda bugs (missing field writes, wrong field names) without needing a
// runtime environment.
//
// Run: ./gradlew smokeTestAliases
tasks.register('smokeTestAliases', JavaExec) {
    group = 'neoorigins'
    description = '[2.0] Validate LegacyPowerTypeAliases remaps against internal pack JSON.'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.PowerAliasSmokeTest'
    args 'src/main/resources/data'
}

// ── Headless compat test ────────────────────────────────────────────────────
//
// Validates origin pack JSONs through the compat translator without launching
// Minecraft. Detects: unsupported types (FAIL), lossy translations (WARN),
// and structural issues in Route B powers.
//
// Run against built-in data:
//   ./gradlew compatTest
//
// Run against external packs (extracted zip/jar directories):
//   ./gradlew compatTest --args="/path/to/pack1 /path/to/pack2"
//
// Exit code 1 if any FAILs are detected.
tasks.register('compatTest', JavaExec) {
    group = 'neoorigins'
    description = 'Headless compat validation — test origin packs without launching MC.'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.CompatTestHarness'
    // Default: scan internal data + example pack
    args 'src/main/resources/data', 'example-pack/data'
}

// ── Compat-verb golden master (registry-refactor Layer-1 regression net) ─────
// Emits a deterministic per-verb recognition + field-coverage dump over the
// built-in corpus. Baselined against the parsers' KNOWN_TYPES; after the
// registry migration (KNOWN_TYPES → CompatRegistries.*Keys()) the regenerated
// artifact must stay byte-identical, proving the registry recognizes exactly
// the same verb set in the same categories.
//
// Run: ./gradlew goldenMaster   (writes compat-golden/compat-verbs.txt — tracked,
// so the byte-identical gate is enforceable via `git diff --exit-code compat-golden`)
tasks.register('goldenMaster', JavaExec) {
    group = 'neoorigins'
    description = '[registry-refactor] Regenerate the compat-verb golden-master baseline.'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.CompatTestHarness'
    args '--golden-master', 'compat-golden/compat-verbs.txt',
         'src/main/resources/data', 'example-pack/data'
}

// ── Phase 2 / D3: regenerate docs/schema/power.schema.json ──────────────────
//
// Emits a full per-power JSON-Schema from the BuiltinPowers FieldSpec registry
// (editor-metadata only — the power Codec parse path never reads this file).
// Deterministic: the top-level type.enum and the oneOf branches are sorted by
// id, and re-running on the generator's own output is byte-identical.
//
// Run: ./gradlew generatePowerSchema   (writes docs/schema/power.schema.json)
tasks.register('generatePowerSchema', JavaExec) {
    group = 'neoorigins'
    description = '[2-D3] Regenerate docs/schema/power.schema.json from BuiltinPowers FieldSpecs.'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.PowerSchemaGenerator'
    args 'docs/schema/power.schema.json'
}

// Regenerate action.schema.json + condition.schema.json from the BuiltinActions /
// BuiltinConditions FieldSpec registries — the action/condition analogue of
// generatePowerSchema (editor-metadata only; the parser path never reads these).
// Run: ./gradlew generateActionConditionSchema   (writes both files)
tasks.register('generateActionConditionSchema', JavaExec) {
    group = 'neoorigins'
    description = '[2] Regenerate docs/schema/{action,condition}.schema.json from the registries.'
    dependsOn 'compileJava'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.ActionConditionSchemaGenerator'
}

// Parity gate: parse the committed action/condition schemas AND the registry-
// generated ones through the production SchemaFormModel and diff per-id field
// shapes. Fails on any MISSING/CHANGED so the registry-parity work is verifiable
// and (once generation is the source of truth) drift is guarded.
// Run: ./gradlew actionConditionSchemaCheck
tasks.register('actionConditionSchemaCheck', JavaExec) {
    group = 'neoorigins'
    description = '[2] Diff committed vs registry-generated action/condition schemas via SchemaFormModel.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.ActionConditionSchemaCheck'
}

// ── 2.1 creator: package the power schema onto the runtime classpath ────────
//
// docs/schema/power.schema.json is the human-facing source of truth. The
// in-game creator's SchemaFormModel reads it at runtime from the classpath,
// so copy it into the resources output at build time (no committed
// duplicate — single source, cannot drift). Resource path is mirrored by
// SchemaFormModel.RESOURCE_PATH.
processResources {
    from('docs/schema/power.schema.json') {
        into 'data/neoorigins/schema'
    }
    from('docs/schema/action.schema.json') {
        into 'data/neoorigins/schema'
    }
    from('docs/schema/condition.schema.json') {
        into 'data/neoorigins/schema'
    }
    from('docs/schema/block_condition.schema.json') {
        into 'data/neoorigins/schema'
    }
    from('docs/schema/item_condition.schema.json') {
        into 'data/neoorigins/schema'
    }
    from('docs/schema/item_action.schema.json') {
        into 'data/neoorigins/schema'
    }
    from('docs/schema/field_docs.json') {
        into 'data/neoorigins/schema'
    }
}

// Headless guard that the schema is actually packaged AND parses into the
// production SchemaFormModel (catches a missing processResources copy or a
// schema edit that breaks the form model). Run: ./gradlew schemaFormCheck
tasks.register('schemaFormCheck', JavaExec) {
    group = 'neoorigins'
    description = '[2.1] Verify power.schema.json packages + parses via SchemaFormModel.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.SchemaFormCheck'
}

// Gate on the authorable power-type surface: every id in the schema's `type`
// enum must have a structured oneOf branch (allowlisted while that gap shrinks)
// and must resolve to a power type PowerTypes actually registers on this branch.
// Run: ./gradlew powerEnumCheck
tasks.register('powerEnumCheck', JavaExec) {
    group = 'neoorigins'
    description = 'Verify the schema type enum is fully branched and fully registered.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.PowerEnumCheck'
}

// Headless guard for the creator's datapack shape rules (origin has no
// id/type, power has type, layer patch is additive+dedup). Pure — no MC
// server. Run: ./gradlew customPackCheck
tasks.register('customPackCheck', JavaExec) {
    group = 'neoorigins'
    description = '[2.1] Verify CustomPackSerializer datapack shape invariants.'
    dependsOn 'classes'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.cyberday1.neoorigins.dev.CustomPackCheck'
}
